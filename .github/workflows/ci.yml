name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # Audit 2026-09-09: run the suite BOTH ways — stdlib-only (the urllib fallback the
    # code must keep working) and with the optional `requests` accelerator (the keep-alive
    # backend the VPS actually runs). Python 3.11 = the Debian 12 target.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: stdlib-only
            install: ""
          - name: with-requests
            install: "pip install -r requirements.txt"
    name: test (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install optional dependencies
        if: matrix.install != ''
        run: ${{ matrix.install }}

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      # Lot 2 (2026-09-15): the admin page's candidate-contract block (app.js) is a literal
      # port of src/candidate_contract.py — check it against the shared fixture with node
      # Depuis le 2026-09-17, node est une dépendance de TEST approuvée (paquet Debian
      # nodejs) et le VPS l'a aussi : ce runner tourne désormais AUSSI dans la suite
      # Python (tests/test_candidate_contract.py, skip propre sans node). L'étape reste
      # ici pour que l'échec soit lisible seul dans le journal de CI.
      - name: Candidate contract — app.js mirror (node)
        if: hashFiles('tests/js/candidate_contract_check.js') != ''
        run: node tests/js/candidate_contract_check.js

      - name: Secret scan (code dirs only)
        run: |
          # Scan source dirs only, so this workflow's own patterns don't self-match.
          if grep -rInE 'BEGIN (RSA |OPENSSH )?PRIVATE KEY|xox[baprs]-[0-9A-Za-z-]{10,}|ghp_[A-Za-z0-9]{30,}' src scripts tests; then
            echo "::error::Potential secret detected in source"; exit 1
          fi
          echo "No obvious secrets in source."
