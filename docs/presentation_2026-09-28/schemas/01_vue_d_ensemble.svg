<text x="760.0" y="503.0" text-anchor="middle" style="font-family:Inter, 'Segoe UI', Helvetica, Arial, sans-serif;font-size:18px;font-weight:normal;fill:#52514e;font-style:italic">CDP</text>
<path d="M1110,470 L1170,470 L1170,315 L1220,315" fill="none" stroke="#52514e" stroke-width="3" marker-end="url(#pointe)"/>
<text x="1165" y="160" text-anchor="middle" style="font-family:Inter, 'Segoe UI', Helvetica, Arial, sans-serif;font-size:18px;font-weight:normal;fill:#52514e;font-style:italic">lit le feed · remplit · clique « Create »</text>
