<text x="640.0" y="395.0" text-anchor="middle" style="font-family:Inter, 'Segoe UI', Helvetica, Arial, sans-serif;font-size:18px;font-weight:normal;fill:#52514e;font-style:italic">lance, suit</text>
<line x1="570" y1="610" x2="570" y2="660" stroke="#52514e" stroke-width="3" marker-end="url(#pointe)"/>
<text x="570.0" y="625.0" text-anchor="middle" style="font-family:Inter, 'Segoe UI', Helvetica, Arial, sans-serif;font-size:18px;font-weight:normal;fill:#52514e;font-style:italic">écrit</text>
