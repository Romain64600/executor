<text x="60" y="96" text-anchor="start" style="font-family:Inter, 'Segoe UI', Helvetica, Arial, sans-serif;font-size:20px;font-weight:normal;fill:#52514e;font-style:italic">Une offre est comptée quand la saisie est PROUVÉE : l'offre a disparu du feed rafraîchi. Source : journaux JSONL des deux machines (méthode dans chiffres.md).</text>
