<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AKS Executor — Tri des listes</title>
  <link rel="stylesheet" href="sort.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="dot"></span>
      <h1>Tri des listes<span class="sub">— console</span></h1>
    </div>
    <nav class="tabs">
      <a href="." class="tab">Validation &amp; Submit</a>
      <a href="tri" class="tab active" aria-current="page">Tri des listes</a>
    </nav>
    <span id="busy-ind" class="busy-ind hidden">
      <span class="spin"></span><span id="busy-text"></span>
      <button id="stop-btn" type="button" title="Arrêter le run en cours (proprement)">Arrêter</button>
    </span>
    <div class="topbar-right">
      <button id="login-btn" type="button"
        title="Reconnecter la session AKS (Stage 0b) — te demandera le code 2FA">🔑 Se reconnecter</button>
      <button id="new-scan" type="button" class="primary"
        title="Lancer un scan frais tous-stores (read-only) — pour remplacer un plan périmé">⟳ Nouveau scan</button>
      <select id="run-picker" title="Choisir un scan de tri"></select>
      <button id="refresh" type="button" title="Rafraîchir">↻</button>
      <button id="theme" type="button" title="Basculer le thème">◐</button>
    </div>
  </header>

  <dialog id="login-modal">
    <form method="dialog" class="login-box">
      <h3>Reconnexion AKS</h3>
      <p id="login-msg" class="login-msg">Le mot de passe vient de l'environnement du serveur. Tu ne saisis que le code 2FA, quand il est demandé.</p>
      <div id="login-2fa-row" class="login-2fa hidden">
        <label for="login-2fa">Code 2FA</label>
        <input id="login-2fa" type="text" inputmode="numeric" autocomplete="one-time-code"
          placeholder="123456" autofocus />
        <button id="login-2fa-submit" type="button" class="primary">Valider</button>
      </div>
      <div class="login-actions">
        <button id="login-start" type="button" class="primary">Lancer la reconnexion</button>
        <button id="login-close" type="button" value="cancel">Fermer</button>
      </div>
    </form>
  </dialog>

  <div id="banner" class="banner hidden"></div>

  <main id="app">
    <div id="empty" class="empty">Chargement…</div>
    <section id="console" class="hidden">
      <div id="summary" class="summary"></div>
      <div id="board" class="board"></div>
      <div id="secondary" class="secondary"></div>
    </section>
  </main>

  <dialog id="offers-modal">
    <div class="modal-head">
      <h3 id="modal-title"></h3>
      <button id="modal-close" type="button">✕</button>
    </div>
    <div id="modal-actions" class="actions"></div>
    <div id="modal-status" class="status-pane hidden"></div>
    <details class="cmds-wrap">
      <summary>Commandes CLI équivalentes (référence)</summary>
      <div id="modal-cmds" class="cmds"></div>
    </details>
    <div class="tablewrap"><table id="modal-table"><thead><tr>
      <th class="c-store">Store</th><th>Offre marchand</th><th>Raison</th>
    </tr></thead><tbody></tbody></table></div>
  </dialog>

  <footer id="status" class="idle">Prêt</footer>
  <script src="sort.js"></script>
</body>
</html>
