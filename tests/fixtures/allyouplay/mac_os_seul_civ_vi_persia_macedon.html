ality=75/content/products/gallery/sid-meiers-civilization-vi-persia-and-macedon-civilization-scenario-pack-mac_c141f1af.1728565459.jpeg",{},"Sid Meier's Civilization VI - Persia and Macedon Civilization & Scenario Pack [Mac]","Alexander leads Macedon and Cyrus leads Persia in Sid Meier’s Civilization VI! ","\u003Cp>\u003Cstrong>In order to activate this game, you will require a third-party 'Steam' account. For full details on how to activate please follow this link: \u003Ca href=\"https://support.steampowered.com/kb_article.php?ref=5414-TFBN-1352\">https://support.steampowered.com/kb_article.php?ref=5414-TFBN-1352\u003C/a>\u003C/strong>\u003C/p>\r\n\u003Cp>Alexander leads Macedon and Cyrus leads Persia in Sid Meier’s Civilization VI! Macedon’s abilities will let you conquer the whole world, and Persia can grow rich and cultured, or launch surprise invasions with incredible ease. These historical adversaries are paired well together, and feature in the new “Conquests of Alexander” scenario. Can you determine the fate of the Near East, and the course of history?\u003Cbr />Includes the Macedonian civilization with Alexander the Great, the Hypaspist unique unit, and the Basilikoi Paides unique building:\u003Cbr />Civ Unique Ability: The “Hellenistic Fusion” ability gives Macedon Tech or Civic Eurekas depending on what Districts are present in a captured city.\u003Cbr />Leader Unique Ability: Alexander’s “To World’s End” ability lets Macedon stay at war longer by greatly reducing war weariness. He also gives Macedon the Hetairoi: a fast Heavy Cavalry unit that starts with a free promotion, which replaces the Horseman.\u003Cbr />Unique Unit: The Hypaspist replaces the Swordsman, gets extra bonuses from supporting units, and is stronger at besieging Districts. \u003Cbr />Unique Building: The Basilikoi Paides can be built in any Encampment that doesn’t have a stable. It provides bonuses for all melee, ranged land, and Hetairoi trained in the city. It also provides some science anytime a non-civilian unit is created in the city.\u003Cbr />Also includes the Persian civilization with Cyrus, the Immortal unique unit, and the Pairidaeza unique improvement:\u003Cbr />Civ Unique Ability: The “Satrapies” ability gives Persia a free Trade Route when they develop Political Philosophy, and enhanced yields from their internal trade routes.\u003Cbr />Leader Unique Ability: Cyrus has the “Fall of Babylon” ability, giving movement and yield bonuses for a short time after declaring a Surprise War, and negating some of the diplomatic penalties of declaring a Surprise War too.\u003Cbr />Unique Unit: Persia’s unique unit is the famous Immortal. This Swordsman replacement gets a bonus ranged attack, and is very strong on defense.\u003Cbr />Unique Improvement: The Pairidaeza provide Culture, Gold, and Appeal, as well as bonus Culture or Gold for adjacent Districts and City Centers. Over time, they’ll provide even more yields as you advance through the tech &amp; civic tree.\u003Cbr />New “Conquests of Alexander” Scenario:\u003Cbr />Race against time to prove yourself as great a conqueror as Alexander the Great! This scenario is focused on combat, expansion, and the calculated use of your Great Generals.\u003Cbr />As you increase the difficulty, you have fewer and fewer turns in which to conquer the known world, providing a real challenge for military strategists.\u003Cbr />Two New Wonders:\u003Cbr />Mausoleum at Halicarnassus: One of the Seven Wonders of the Ancient World returns to Civilization. The Mausoleum allows you to get additional bonuses from your Great Admirals and Great Engineers. \u003Cbr />Apadana: The Persians were famous for their audience halls, and the best example was found in Persepolis. This Wonder provides extra Envoys every time you build a World Wonder – including the Apadana!\u003Cbr />\u003Cbr />©2017 Take-Two Interactive Software and its subsidiaries. Sid Meier’s Civilization, Civilization, Civ, 2K, Firaxis Games, Take-Two Interactive Software and their respective logos are all trademarks of Take-Two Interactive Software, Inc. All other marks and trademarks are the property of their respective owners. All rights reserved.\u003C/p>","Macedon’s abilities will let you conquer the whole world, and Persia can grow rich and cultured, or launch surprise invasions with incredible ease!","Sid Meier's Civilization VI - Persia and Macedon Civilization & Scenario Pack | ALLYOUPLAY","sid-meiers-civilization-vi-persia-and-macedon-civilization-scenario","Aspyr","SimpleProduct","\u003Cul>\u003Clegend>Minimum Requirements\u003C/legend>\u003Cli>OS : 10.11.6 (El Capitan) and 10.12.4 (Sierra)\u003C/li>\u003Cli>Processor : Intel Core i5 (4 cores)\u003C/li>\u003Cli>Memory : 6 GB RAM\u003C/li>\u003Cli>Graphics : (ATI)\u003C/li>\u003Cli>Storage : 15 GB available space\u003C/li>\u003C/ul>\u003Cul>\u003Clegend>Recommended Requirements\u003C/legend>\u003C/ul>","https://cdn.allyouplay.com/cdn-cgi/image/format=auto,quality=75/content/products/sid-meiers-civilization-vi-persia-and-macedon-civilization-sce_33509_0_499772f8.1728565348.jpeg",12,"2017-04-20T08:31:00","079b976c-a1bc-4a76-8dfb-87d7266bcfb6",{"name":53,"se_name":53,"id":71,"custom_properties":344},{},{"is_gift_card":52,"recipient_name":53,"recipient_email":53,"sender_name":53,"sender_email":53,"message":53,"gift_card_type":346,"custom_properties":347},"Virtual",{},"DontManageStock",{"currency_code":350,"old_price":53,"old_price_value":53,"price":351,"price_with_discount":53,"price_value":352,"price_with_discount_value":53,"customer_enters_price":52,"call_for_price":52,"product_id":353,"hide_prices":52,"is_rental":52,"rental_price":53,"rental_price_value":53,"display_tax_shipping_info":52,"base_price_p_ang_v":53,"base_price_p_ang_v_value":352,"custom_properties":354},"EUR","€8.99",8.99,33509,{},{"product_id":353,"entered_quantity":71,"minimum_quantity_notification":53,"allowed_quantities":356,"customer_enters_price":52,"customer_entered_price":71,"customer_ente
