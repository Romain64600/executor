Cp>Les Coupons ne peuvent pas être utilisés en dehors de l’Union européenne.\u003C/p>\r\n\u003Cp>Un compte Tinder est requis. Les utilisateurs•trices de Tinder doivent avoir plus de 18 ans.\u003C/p>\r\n\u003Cp>Confidentialité des données : l’utilisateur•trice consent à ce que Tinder partage des informations limitées en lien avec son compte Tinder (notamment le numéro de téléphone, l’abonnement en cours et le statut du Coupon) avec Epay/Euronet et Allyouplay afin de permettre l’émission du Coupon et son utilisation.\u003C/p>\r\n\u003Cp>Les Coupons ne peuvent être utilisés si un abonnement est déjà actif.\u003C/p>\r\n\u003Cp>Si tu renouvelles ton abonnement et que tu as reçu un Coupon, la formule d’abonnement que tu as choisie sera renouvelée sur le même compte Tinder que celui sur lequel tu as utilisé ton premier Coupon.\u003C/p>\r\n\u003Cp>Une fois qu’un Coupon a été utilisé, le même code ne peut plus être utilisé par une autre personne, même si celui-ci n’a pas été appliqué avec succès.\u003C/p>\r\n\u003Cp>Les Coupons expirent cinq ans après la date d’achat. Aucune demande d’extension de délai ne sera acceptée.\u003C/p>\r\n\u003Cp>Les coupons Tinder (« Coupons ») sont soumis à disponibilité et ne peuvent être utilisés que dans l’Union européenne.\u003C/p>\r\n\u003Cp>Pour un usage personnel uniquement, la revente est interdite.\u003C/p>\r\n\u003Cp>Les Coupons peuvent être utilisés via le lien fourni.\u003C/p>\r\n\u003Cp>Cette offre n’est pas cumulable et ne peut être échangée contre de l’argent.\u003C/p>\r\n\u003Cp>L’éligibilité à l’offre est soumise aux conditions d’utilisation de Tinder (https://gotinder.com/terms). Tinder est une marque déposée de Match Group, LLC.\u003C/p>\r\n\u003Cp>Voir les conditions générales\u003C/p>\r\n\u003Cp>\u003Ca href=\"https://www.help.tinder.com/hc/fr/articles/115004487406-Abonnements-Tinder\">https://www.help.tinder.com/hc/fr/articles/115004487406-Abonnements-Tinder\u003C/a>\u003C/p>\r\n\u003Cp>\u003Ca href=\"https://www.help.tinde
