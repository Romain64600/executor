_url":289,"thumb_image_url":289,"full_size_image_url":289,"title":258,"alternate_text":259,"custom_properties":290},"https://cdn.allyouplay.com/cdn-cgi/image/format=auto,quality=75/content/products/gallery/nivalis-nights_79bae81b.1790588116.jpg",{},{"image_url":292,"thumb_image_url":292,"full_size_image_url":292,"title":258,"alternate_text":259,"custom_properties":293},"https://cdn.allyouplay.com/cdn-cgi/image/format=auto,quality=75/content/products/gallery/nivalis-nights_f4a8cd58.1790588116.jpg",{},{"image_url":295,"thumb_image_url":295,"full_size_image_url":295,"title":258,"alternate_text":259,"custom_properties":296},"https://cdn.allyouplay.com/cdn-cgi/image/format=auto,quality=75/content/products/gallery/nivalis-nights_d577493c.1790588116.jpg",{},"Nivalis Nights","Grow your business, manage restaurants and nightclubs, make friends and enemies, buy and decorate apartments, go fishing and maybe even find love in a cyberpunk city that stretches from the ocean to the clouds.","\u003Cp>Welcome to the cyberpunk city of Nivalis, where neon dreams become your reality!\u003C/p>\r\n\u003Cp>&nbsp;\u003C/p>\r\n\u003Cp>In a district pushed to the brink by CorpSec crackdowns and a mysterious serial killer, your ambition is your best weapon. Start humble with a noodle stand, then climb your way up to own the city’s top restaurants and premier nightclubs.\u003C/p>\r\n\u003Cp>&nbsp;\u003C/p>\r\n\u003Cp>In this slice-of-life simulation, every day is a choice: will you spend it growing your business or forging bonds with the city’s strange inhabitants? From managing bustling ramen bars to navigating complex relationships, your influence grows with every decision. Whether you’re legally growing your own ingredients or illegally sabotaging your rivals under the cover of curfew, this city is yours to conquer.\u003C/p>\r\n\u003Cp>&nbsp;\u003C/p>\r\n\u003Cp>When the pressure gets too high, retreat to the docks to explore the city by boat, customize your home to perfection, or master a high-stakes cyberpunk chess tournament. With a realistic weather system and a vibrant cast of characters to meet, “Nivalis Nights” offers a unique simulation where your path is entirely up to you.\u003C/p>\r\n\u003Cp>&nbsp;\u003C/p>\r\n\u003Cp>Features:\u003C/p>\r\n\u003Cul>\r\n\u003Cli>Choose how you spend each day in this cyberpunk slice of life.\u003C/li>\r\n\u003Cli>Manage businesses like restaurants, ramen bars or night clubs.\u003C/li>\r\n\u003Cli>Buy or grow your own ingredients.\u003C/li>\r\n\u003Cli>Explore the city with your own boat and go fishing.\u003C/li>\r\n\u003Cli>Decorate your home(s) or customize others for friends.\u003C/li>\r\n\u003Cli>Discover the stories of the people you meet in the city and manage your relationships with them.\u003C/li>\r\n\u003Cli>Challenge NPC’s for mini games and take part in a chess tournament.\u003C/li>\r\n\u003Cli>Avoid security systems during curfew and commit sabotage to your competitors. But beware! What happens to them, can happen to you as well.\u003C/li>\r\n\u003C/ul>\r\n\u003Cp>\u003Cbr />\u003Cbr />In order to activate this game, you will require a third-party 'Steam' account. For full details on how to activate please follow this link: \u003Ca href=\"https://support.steampowered.com/kb_article.php?ref=5414-TFBN-1352\">https://support.steampowered.com/kb_article.php?ref=5414-TFBN-1352\u003C/a>&nbsp;\u003Cbr />\u003Cbr />© 2026. Developed by ION LANDS. Published by 505 Games. The Nivalis Nights name and logo are trademarks of ION LANDS. The 505 Games name and logo are trademarks of 505 Games SpA and may be registered trademarks in certain countries. All rights reserved.\u003C/p>","nivalis-nights-row-sept-26-79f46a66-3ba9-44ed-a33f-47824d5de5e6","ION LANDS","505 Games","SimpleProduct","\u003Cul>\u003Clegend>Minimum Requirements\u003C/legend>\u003Cli>OS : Windows 10/11 (64 bit)\u003C/li>\u003Cli>Processor : Intel Core i5-11600K / AMD Ryzen 5 3600\u003C/li>\u003Cli>Memory : 16 GB RAM\u003C/li>\u003Cli>Graphics : NV
