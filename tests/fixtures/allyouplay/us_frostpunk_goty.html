ent/products/gallery/frostpunk-game-of-the-year-edition_cdbf712f.1726744012.jpg",{},{"image_url":277,"thumb_image_url":277,"full_size_image_url":277,"title":247,"alternate_text":247,"custom_properties":278},"https://cdn.allyouplay.com/cdn-cgi/image/format=auto,quality=75/content/products/gallery/frostpunk-game-of-the-year-edition_121bec00.1726744012.jpg",{},{"image_url":280,"thumb_image_url":280,"full_size_image_url":280,"title":247,"alternate_text":247,"custom_properties":281},"https://cdn.allyouplay.com/cdn-cgi/image/format=auto,quality=75/content/products/gallery/frostpunk-game-of-the-year-edition_b85cc1dc.1726744012.jpg",{},{"image_url":283,"thumb_image_url":283,"full_size_image_url":283,"title":247,"alternate_text":247,"custom_properties":284},"https://cdn.allyouplay.com/cdn-cgi/image/format=auto,quality=75/content/products/gallery/frostpunk-game-of-the-year-edition_b2120982.1726744013.jpg",{},"Frostpunk: Game Of The Year Edition","Frostpunk: Game of the Year Edition","\u003Cp>\u003Cstrong>Frostpunk: Game of the Year Edition\u003C/strong> consists of:\u003Cbr />\u003Cbr />\u003Cstrong>Frostpunk\u003C/strong> – the full version of the highly acclaimed society survival game, which sold over 3 000 000 copies worldwide and won a number of critics awards.\u003Cbr />\u003Cbr />\u003Cstrong>Frostpunk Season Pass\u003C/strong> - a set of three expansions of the Frostpunk universe:\u003Cbr />\u003Cbr />\u003Cstrong>The Last Autumn\u003C/strong> is a turning point in the Frostpunk universe. Revealing the restless events of Site 113 and its struggle to construct the generator before the freezing veil shrouds the Earth, this prequel expansion broadens the Frostpunk universe by introducing a new environment, new Books of Laws and unique technologies, and presents a range of new buildings — all of which let you shape society and the city in unconventional ways.\u003Cbr />\u003Cbr />\u003Cstrong>On The Edge\u003C/strong> expansion tells a story of citizens of New London sent for a special assignment after the Great Storm. It not only opens a brand new chapter set in the Frostpunk universe but also pits you against new challenges and offers unique mechanics, both in the city and on the Frostland map - further enriching the core experience.\u003Cbr />\u003Cbr />\u003Cstrong>The Rifts\u003C/strong> allows you to experience a new level of challenge on a brand new Endless Mode map, where the land itself threatens your survival. Using a new gameplay mechanic, bridge the rifts to access new areas. Expand the city to save your people from the inevitable doom!\u003Cbr />\u003Cbr />Also, you’ll get additional digital content:\u003Cbr />\u003Cbr />\u003Cstrong>Frostpunk Original Soundtrack\u003C/strong> - it's the original soundtrack from the game, composed by Piotr Musiał and performed by Atom String Quartet &amp; Sofia Session Orchestra. All tracks mastered and mixed for the digital version of the album, delivered in all popular formats.\u003Cbr />\u003Cbr />\u003Cstrong>Frostpunk Digital Artbook\u003C/strong> - presents all the unique art from the game as well as the history of people working on the visual design, concept art and inspirations.\u003C/p>\r\n\u003Cp>\u003Cstrong>ABOUT THE GAME\u003C/strong>\u003Cbr />Frostpunk is a blend of city-builder, society survival and a strategy game where heat means life and every decision comes at a price. In an entirely frozen world, people develop steam-powered technology to oppose the overwhelming cold. You face the task of building the last city on Earth and securing the means necessary for your community to survive.\u003Cbr />\u003Cbr />Optimization and resource management often clash with empathy and thoughtful decision-making. While city and society management will consume most of the ruler’s time, at some point exploration of the outside world is necessary to understand its history and the present state.\u003Cbr />\u003Cbr />What decisions will you make to ensure the survival of your society? What will you do when pushed to the limit? And who will you become in the process? \u003Cbr />\u003Cbr />In order to activate this game, you will require a third-party 'Steam' account. For full details on how to activate please follow this link: \u003Ca href=\"https://support.steampowered.com/kb_article.php?ref=5414-TFBN-1352\">https://support.steampowered.com/kb_article.php?ref=5414-TFBN-1352&nbsp;\u003C/a> \u003Cbr />\u003Cbr />© 2018 11 bit studios S.A. Frostpunk™, 11 bit studios™ and respective logos are trademarks of 11 bit studios S.A. All rights reserved.\u003C/p>","frostpunk-game-of-the-year-edition-row_1-7507f423-4680-4758-b7a0-3d69766c2b65","11 bit studios","11 Bit Studios","SimpleProduct","\u003Cul>\u003Clegend>Minimum Requirements\u003C/legend>\u003Cli>OS : 64-bit Windows 7/8/10\u003C/li>\u003Cli>Processor : 3.2 GHz Dual Core Processor\u003C/li>\u003Cli>Memory : 4 GB RAM\u003C/li>\u003Cli>Graphics : GeForce GTX 660, Radeon R7 370 or equivalent with 2 GB of video RAM\u003C/li>\u003Cli>DirectX : Version 11\u003C/li>\u003Cli>Storage : 8 GB available space\u003C/li>\u003Cli>Sound Card : DirectX compatible\u003C/li>\u003Cli>Additional Notes : Please make sure that you have the latest VC package installed, and - if you're using Windows 7 or 8 - that you have the KB4019990 update applied.\u003C/li>\u003Cli>OS : MacOS 10.15\u003C/li>\u003Cli>Processor : 2.6GHz Intel Core i7\u003C/li>\u003Cli>Memory : 16 GB RAM\u003C/li>\u003Cli>Graphics : 4GB AMD Radeon Pro 5300M, Radeon Pro 560X or better\u003C/li>\u003Cli>Storage : 10 GB available space\u003C/li>\u003Cli>Additional Notes : Check the Frostpunk website for more detailed specifications\u003C/li>\u003C/ul>\u003Cul>\u003Clegend>Recommended Requirements\u003C/legend>\u003Cli>OS : 64-bit Windows 7/8/10\u003C/li>\u003Cli>Processor : 3.2 GHz Quad Core Processor\u003C/li>\u003Cli>Memory : 8 GB RAM\u003C/li>\u003Cli>Graphics : GeForce 960, Radeon RX 570 or equivalent with 4GB of video RAM\u003C/li>\u003Cli>DirectX : Version
