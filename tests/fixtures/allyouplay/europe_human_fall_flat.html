allery/human-fall-flat_aeb4656d.1765983606.",{},"Human Fall Flat","Human Fall Flat is a hilarious, light-hearted platformer set in floating dreamscapes that can be played solo or with up to 8 players online. Free new levels keep its vibrant community rewarded.","\u003Cp class=\"bb_paragraph\">\u003Cspan class=\"bb_img_ctn\">\u003Cimg class=\"bb_img\" src=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/477160/extras/c9ac994c3d446a46226ad13fa33e8cf5.webp?t=1764588140\" width=\"616\" height=\"50\" />\u003C/span>\u003C/p>\r\n\u003Ch2 class=\"bb_tag\">\u003Cstrong>***NEW LEVEL 'STEAMPUNK PARTY' AVAILABLE NOW***\u003C/strong>\u003C/h2>\r\n\u003Cp class=\"bb_paragraph\">\u003Cstrong>PARTY ANIMALS NEMO &amp; OTTA JOIN HUMAN FALL FLAT\u003C/strong>\u003C/p>\r\n\u003Cp class=\"bb_paragraph\">Party Animals’ Nemo &amp; Otta join the mayhem in the very first crossover collaboration for Human Fall Flat! The pair make their cameo in SteamPunk Party, the game’s 31st official level that’s packed with perilous steam vents, broken pipes and dizzying high-wire physics-based platforming.\u003C/p>\r\n\u003Cp class=\"bb_paragraph\">\u003Cstrong>Join 55 million players across all formats, and explore more than 5,000 unofficial levels from our community creators too!\u003C/strong>\u003C/p>\r\n\u003Cp class=\"bb_paragraph\">\u003Cstrong> \u003C/strong>\u003C/p>\r\n\u003Ch2 class=\"bb_tag\">\u003Cstrong>Human Fall Flat is a hilarious, light-hearted physics platformer set in a world of floating dreamscapes.\u003C/strong>\u003C/h2>\r\n\u003Cp class=\"bb_paragraph\">Each dream level provides a new environment to navigate, from mansions, castles and Aztec adventures to snowy mountains, eerie nightscapes and industrial locations. Multiple routes through each level, and perfectly playful puzzles ensure exploration and ingenuity are rewarded.\u003C/p>\r\n\u003Cp class=\"bb_paragraph\">\u003Cspan class=\"bb_img_ctn\">\u003Cimg class=\"bb_img\" src=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/477160/extras/b24784e26545661c147e5117736756bb.webp?t=1764588140\" width=\"616\" height=\"50\" />\u003C/span>\u003C/p>\r\n\u003Cp class=\"bb_paragraph\">Need a hand getting that boulder on to a catapult, or need someone to break that wall? Online multiplayer for up to 8 players transforms the way Human Fall Flat is played.\u003C/p>\r\n\u003Cp class=\"bb_paragraph\">\u003Cspan class=\"bb_img_ctn\">\u003Cimg class=\"bb_img\" src=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/477160/extras/810e6a0eb71b28d2c0d909dda878ffa6.webp?t=1764588140\" width=\"616\" height=\"50\" />\u003C/span>\u003C/p>\r\n\u003Cp class=\"bb_paragraph\">Your Human is yours to customise. With outfits from builder to chef, skydiver, miner, astronaut and ninja. Choose your head, upper and lower body and get creative with the colours!\u003C/p>\r\n\u003Cp class=\"bb_paragraph\">\u003Cspan class=\"bb_img_ctn\">\u003Cimg class=\"bb_img\" src=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/477160/extras/60a92fa1b2244cc352338d8c738d7b65.webp?t=1764588140\" width=\"616\" height=\"50\" />\u003C/span>\u003C/p>\r\n\u003Cp class=\"bb_paragraph\">The Human Fall Flat Workshop, unique to Steam, is a fantastic tool which, used alongside Unity, enables players to build their own Human Fall Flat content and share it with others around the world. Not interested in building levels, lobbies or skins yourself? You can also download more than 5000 different levels and explore other people's creations directly from Steam!\u003C/p>\r\n\u003Cp class=\"bb_paragraph\">\u003Cspan class=\"bb_img_ctn\">\u003Cimg class=\"bb_img\" src=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/477160/extras/e99b361a3c39f6c8dee71bf1719847a0.webp?t=1764588140\" width=\"616\" height=\"50\" />\u003C/span>\u003C/p>\r\n\u003Cp class=\"bb_paragraph\">Streamers and YouTubers flock to Human Fall Flat for its unique, hilarious gameplay. Fans have watched these videos more than 3 Billion times!\u003C/p>","human-fall-flat-curv-ga-ste-humanfall6-sta-ceur-curv-ga-ste-humanfall6-sta-ceur","No Brakes Games","Curve Games","SimpleProduct","PC: \u003Cstrong>Minimum:\u003C/strong>\u003Cbr>\u003Cul class=\"bb_ul\">\u003Cli>\u003Cstrong>OS *:\u003C/strong> Windows XP/Vista/7/8/8.1/10 x86 and x64\u003Cbr>\u003C/li>\u003Cli>\u003Cstrong>Processor:\u003C/strong> Intel Core2 Duo E6750 (2 * 2660) or equivalent | AMD Athlon 64 X2 Dual Core 6000+ (2 * 3000) or equivalent\u003Cbr>\u003C/li>\u003Cli>\u003Cstrong>Memory:\u003C/strong> 1024 MB RAM\u003Cbr>\u003C/li>\u003Cli>\u003Cstrong>Graphics:\u003C/strong> GeForce GT 740 (2048 MB) or equivalent | Radeon HD 5770 (1024 MB)\u003Cbr>\u003C/li>\u003Cli>\u003Cstrong>Storage:\u003C/strong> 500 MB available space\u003C/li>\u003C/ul> - \u003Cstrong>Recommended:\u003C/strong>\u003Cbr>\u003Cul class=\"bb_ul\">\u003Cli>\u003Cstrong>OS *:\u003C/strong> Windows XP/Vista/7/8/8.1/10 x86 and x64\u003Cbr>\u003C/li>\u003Cli>\u003Cstrong>Processor:\u003C/strong> Intel Core2 Quad Q9300 (4 * 2500) or equivalent | AMD A10-5800K APU (4*3800) or equivalent\u003Cbr>\u003C/li>\u003Cli>\u003Cstrong>Memory:\u003C/strong> 2048 MB RAM\u003Cbr>\u003C/li>\u003Cli>\u003Cstrong>Graphics:\u003C/strong> GeForce GTX 460 (1024 MB) or equivalent | Radeon HD 7770 (1024 MB)\u003Cbr>\u003C/li>\u003Cli>\u003Cstrong>Storage:\u003C/strong> 500 MB available space\u003C/li>\u003C/ul>\r\nMac: \u003Cstrong>Minimum:\u003C/strong>\u003Cbr>\u003Cul class=\"bb_ul\">\u003Cli>\u003Cstrong>OS:\u003C/strong> MacOS 10.11 (“El Capitan”)\u003Cbr>\u003C/li>\u003Cli>\u003Cstrong>Processor:\u003C/strong> Intel Core i5-6500, 3.2 GHz\u003Cbr>\u003C/li>\u003Cli>\u003Cstrong>Memory:\u003C/strong> 8 GB RAM\u003Cbr>\u003C/li>\u003Cli>\u003Cstrong>Graphics:\u003C/strong> AMD Radeon R9 M390\u003Cbr>\u003C/li>\u003Cli>\u003Cstrong>Storage:\u003C/strong> 500 MB available space\u003Cbr>\u003C/li>\u003Cli>\u003Cstrong>Additional Notes:\u003C/strong> Require
